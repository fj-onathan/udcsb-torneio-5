name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancela a que estiver a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py só usa a biblioteca padrão: os emblemas já vêm processados
      # no repositório por tools/prepare_logos.py.
      - name: Gerar o ficheiro único
        run: python3 tools/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes de renderização
        run: |
          npm install --no-audit --no-fund
          npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
